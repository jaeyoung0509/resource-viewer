<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resource Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f6f7f9;
      color: #222;
    }
    h1 { margin: 0 0 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .label { font-size: 12px; color: #6b7280; }
    .value { font-size: 20px; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Resource Checker</h1>
  <div id="grid" class="grid"></div>

  <script>
    const grid = document.getElementById('grid');
    const nodes = new Map();

    function upsertCard(data) {
      const key = data.node;
      let card = nodes.get(key);
      if (!card) {
        card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="label">Node</div>
          <div class="value" data-field="node"></div>
          <div class="label">CPU</div>
          <div class="value" data-field="cpu"></div>
          <div class="label">Memory</div>
          <div class="value" data-field="memory"></div>
          <div class="label">Disk</div>
          <div class="value" data-field="disk"></div>
        `;
        grid.appendChild(card);
        nodes.set(key, card);
      }
      card.querySelector('[data-field="node"]').textContent = data.node;
      card.querySelector('[data-field="cpu"]').textContent = `${data.cpu.toFixed(1)}%`;
      card.querySelector('[data-field="memory"]').textContent = `${data.memory.toFixed(1)}%`;
      card.querySelector('[data-field="disk"]').textContent = `${data.disk.toFixed(1)}%`;
    }

    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${scheme}://${location.host}/ws`);
    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        upsertCard(data);
      } catch (err) {
        console.error('invalid payload', err);
      }
    };
  </script>
</body>
</html>
